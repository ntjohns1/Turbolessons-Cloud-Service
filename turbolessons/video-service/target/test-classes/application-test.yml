spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://localhost/realms/test/protocol/openid-connect/certs
  application:
    name: video-service
  cloud:
    gateway:
      enabled: false
      redis:
        enabled: false
    discovery:
      enabled: false
    config:
      enabled: false
eureka:
  client:
    enabled: false
google:
  bucket:
    name: ${bucketName:test-bucket}
  credentials:
    # Test-only throwaway service-account JSON (structurally valid, not a real key).
    # Parsed at startup by StorageConfig; never used for network calls in contextLoads.
    path: ${credentialsPath:src/test/resources/test-gcs-credentials.json}
  project:
    id: ${projectId:test-project}
