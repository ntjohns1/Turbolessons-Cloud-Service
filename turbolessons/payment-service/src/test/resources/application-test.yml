spring:
  application:
    name: payment-service
  cloud:
    gateway:
      enabled: false
      redis:
        enabled: false
    discovery:
      enabled: false
    config:
      enabled: false
      fail-fast: false # Don't fail if config server is not available
      import: optional:configserver:http://config-service:9999/ # Make config server optional
  security:
    oauth2:
      # Test-only: lazy jwk-set-uri (never fetched during contextLoads) + static token-uri,
      # so no network/discovery is required and no real IdP is needed.
      resourceserver:
        jwt:
          jwk-set-uri: https://localhost/realms/test/protocol/openid-connect/certs
      client:
        provider:
          okta:
            token-uri: https://localhost/realms/test/protocol/openid-connect/token
        registration:
          okta:
            authorization-grant-type: client_credentials
            client-id: ${OKTA_API_SERVICES_ID:test-client}
            client-secret: ${OKTA_API_SERVICES_SECRET:test-secret}
            scope: stripe_client
eureka:
  client:
    enabled: false
STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY:pk_test_dummy}
STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:sk_test_dummy}
