spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://localhost/realms/test/protocol/openid-connect/certs
  application:
    name: event-service
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  cloud:
    config:
      enabled: false
    bootstrap:
      enabled: false
    gateway:
      enabled: false
      redis:
        enabled: false
    discovery:
      enabled: false
eureka:
  client:
    enabled: false
server:
  port: 0  # Random port for unit tests
