spring:
  application:
    name: email-service
  cloud:
    gateway:
      enabled: false
      redis:
        enabled: false
    discovery:
      enabled: false
    config:
      enabled: false
  mongodb:
    embedded:
      version: 4.4.16
  data:
    mongodb:
      port: 27018
  mail:
    host: smtp.gmail.com
    username: nelsontjohns@gmail.com
    password: ${EMAIL_SECRET:test-mail-secret}
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    templates:
      path: mail-templates
  main:
    web-application-type: none
  security:
    oauth2:
      client:
        provider:
          okta:
            token-uri: https://localhost/realms/test/protocol/openid-connect/token
        registration:
          okta:
            authorization-grant-type: client_credentials
            client-id: ${OKTA_CLIENT_ID:test-client}
            client-secret: ${OKTA_CLIENT_SECRET:test-secret}
            scope: email_client
attachment:
  invoice: path_to_file
eureka:
  client:
    enabled: false