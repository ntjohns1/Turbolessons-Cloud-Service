name: admin-service-test

on:
  push:
    paths:
      - "turbolessons/admin-service/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:

    - name: Set up JDK 17
      uses: actions/setup-java@v3.12.0
      with:
        distribution: 'adopt'
        java-version: '17'

    - name: Checkout code
      uses: actions/checkout@v3.6.0

    - name: Run Maven Tests
      working-directory: turbolessons/admin-service
      run: |
        mvn test -DADMIN_SERVICE_API_TOKEN=${{ secrets.ADMIN_SERVICE_API_TOKEN }}
