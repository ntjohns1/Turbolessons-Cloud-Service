name: email-service-qac

# QAC environment pipeline (Git Flow: develop -> QAC, master -> prod).
# Build runs on a GitHub-hosted runner; deploy runs on the self-hosted
# runner (server_3) which has routing into the lab and SSHes to the QAC host.
on:
  push:
    branches:
      - 'dev'
    paths:
      - 'turbolessons/email-service/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3.6.0

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push email-service (qac)
        uses: docker/build-push-action@v4
        with:
          context: turbolessons/email-service
          push: true
          tags: noslenj/email-service:qac

  deploy:
    needs: build
    runs-on: self-hosted
    concurrency:
      group: qac-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy email-service to QAC host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QAC_HOST }}
          username: ${{ secrets.QAC_USER }}
          key: ${{ secrets.QAC_SSH_KEY }}
          port: ${{ secrets.QAC_SSH_PORT }}
          script: |
            cd ~/turbolessons-qac
            docker compose pull email-service
            docker compose up -d email-service
