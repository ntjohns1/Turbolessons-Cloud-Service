name: config-service-qac

# QAC environment pipeline (Git Flow: release/* -> QAC, master -> prod).
# Build runs on a GitHub-hosted runner; deploy runs on the self-hosted
# runner (server_3) which has routing into the lab and SSHes to the QAC host.
on:
  workflow_dispatch:
  push:
    branches:
      - 'release/**'
    paths:
      - 'turbolessons/config-service/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3.6.0

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push config-service (qac)
        uses: docker/build-push-action@v4
        with:
          context: turbolessons/config-service
          push: true
          provenance: false
          tags: noslenj/config-service:qac

  deploy:
    needs: build
    runs-on: [self-hosted, qac]
    concurrency:
      group: qac-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy config-service on the QAC host
        run: |
          cd ~/turbolessons-qac
          docker-compose pull config-service
          docker-compose up -d --force-recreate config-service
